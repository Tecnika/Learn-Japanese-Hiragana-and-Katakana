<!DOCTYPE html>
<html>
<head>
    <title>Debug - Missing Files</title>
</head>
<body>
    <h1>Отладка путей GitHub Pages</h1>
    <p>Проверьте загружены ли файлы:</p>
    <ul id="file-list"></ul>
    
    <script>
        const files = ['table.js', 'propisi.js', 'settings.js'];
        const list = document.getElementById('file-list');
        
        files.forEach(file => {
            const li = document.createElement('li');
            const link = document.createElement('a');
            link.href = file;
            link.textContent = file;
            link.target = '_blank';
            
            // Проверяем доступность файла
            fetch(file)
                .then(response => {
                    if (response.ok) {
                        li.style.color = 'green';
                        li.textContent = `✅ ${file} - OK`;
                    } else {
                        li.style.color = 'red';
                        li.textContent = `❌ ${file} - ${response.status}`;
                    }
                })
                .catch(error => {
                    li.style.color = 'red';
                    li.textContent = `❌ ${file} - ${error.message}`;
                });
            
            list.appendChild(li);
        });
    </script>
</body>
</html>
